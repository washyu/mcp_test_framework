version: 2

ollama:
  base_url: http://192.168.10.81:11434
  model: qwen3.6:latest
  timeout_seconds: 120

mcp_server:
  command: uvx
  args: [homelab-mcp]
  timeout_seconds: 30

judge_timeout_seconds: 120

# ---------------------------------------------------------------------------
# tools opt-in allowlist (SEED-022: framework is a primitive; operator owns
# safety). Phase 30 UAT-1 surfaced that the contract suite calls every
# enabled tool with empty args during the output-conformance bucket
# (test_empty_args_call_returns_non_error, test_result_has_content_or_structured,
# test_text_content_parses_as_json). For tools whose inputSchema declares
# required: [...] fields, the call is rejected by homelab-mcp upstream
# (safe) -- but it would still fire against a poorly-coded MCP that
# validates AFTER side effects.
#
# Policy here: only tools that succeed on an empty-args call stay
# enabled. Required-param tools are skipped until either:
#   (a) per-tool call_arguments: are authored with dry-run-safe values, or
#   (b) the framework grows per-test skip granularity ("skip output-
#       conformance bucket for tools with required-fields") so the judge
#       + schema buckets can still run against them.
# Both are tracked as Phase 30 follow-ups.
# ---------------------------------------------------------------------------
tools:
  # --- enabled: empty-args call is safe + meaningful ---
  list_keyring_credentials: {}
  suggest_deployments: {}
  analyze_network_topology: {}
  create_infrastructure_backup: {}
  get_network_sitemap: {}
  list_available_services: {}
  list_registered_servers: {}
  purge_failed_discoveries: {}
  scan_infrastructure_drift: {}

  # --- skipped: required inputSchema fields; empty-args call would always
  #     error (homelab-mcp upstream catches it today, but the framework
  #     should not depend on that for safety). Re-enable per tool by
  #     authoring `call_arguments: {<field>: <safe-value>}`. ---
  bulk_discover_and_map:
    skip: true
    skip_reason: "requires 'targets'; needs call_arguments for safe empty call"
  check_ansible_service:
    skip: true
    skip_reason: "requires 'service_name'; needs call_arguments for safe empty call"
  check_service_requirements:
