[project]
name = "mcp-contracts"
version = "1.5.0"
description = "Pytest framework for testing MCP servers end-to-end."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # `[cli]` extra pulls Typer transitively. Do NOT declare `typer` directly
    # -- it must remain transitive via mcp[cli] so we have a single source of
    # truth for the CLI framework version.
    "mcp[cli]>=1.27",
    "pydantic>=2.13,<3",
    "pydantic-settings[yaml]>=2.14",
    "jsonschema>=4.26",
]

[project.scripts]
# Phase 26 D-05/D-06: dist name is "mcp-contracts" (D-01); script name
# "mcp-contracts" is the new primary; "mcp-test-framework" is retained for
# v1.4 as a back-compat deprecation shim (D-06) and is removed in v1.5
# (D-18). Both scripts dispatch to importable package "mcp_test_framework";
# the primary points at the Typer instance `app`, the shim points at the
# wrapper in `_deprecated_script.py` (created in Plan 26-02).
mcp-contracts = "mcp_test_framework.cli:app"
mcp-test-framework = "mcp_test_framework._deprecated_script:main"

[project.entry-points.pytest11]
# Phase 26 D-09 / PACK-01: pytest auto-loads this plugin via the pytest11
# entry-point group. Operators no longer need `pytest_plugins=[...]` in
# their conftest. Module body is created in Plan 26-02; this declaration
# only references it (the wheel-shape gate in 26-04 verifies both halves).
mcp_test_framework = "mcp_test_framework._plugin"
# Phase 29 D-04 / REPORTER-02: second pytest11 key for the live domain-UI
# reporter. Independently disable-able via
# `pytest -p no:mcp_test_framework_reporter` while keeping the contract
# fixtures registered under the key above.
mcp_test_framework_reporter = "mcp_test_framework._reporter"

# PEP 735 dev dependency group -- the canonical 2026 location for tooling.
# Do NOT use the legacy `[tool.uv].dev-dependencies` block, and do NOT use
# `[project.optional-dependencies].dev` (which would leak dev tools into
# published PyPI metadata if/when this package is released).
[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    # Surfaces hung tests with a per-test deadline + traceback rather than an
    # infinite wait. Opt-in per run: `uv run pytest --timeout=60` (or set
    # `timeout = 60` under [tool.pytest.ini_options] for a project-wide
    # default). Phase 04.1 fixture-cancel-scope hangs and Ollama
    # /api/chat stalls (260507-n0g follow-up) are the motivating cases.
    "pytest-timeout>=2.4",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
# pytest-asyncio strict mode: async tests MUST carry an explicit
# `@pytest.mark.asyncio` marker. Phase 4's session-scoped fixtures
# (mcp_client, judge, target_tool, config) need a session-scoped event
# loop, hence asyncio_default_fixture_loop_scope = "session".
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# Phase 27 D-06: framework dogfoods library mode — contract tests are
# injected via the plugin reading this ini value, not via tests/contract/.
mcp_config_file = "./config.test.yaml"
markers = [
  "live_homelab: requires homelab-mcp runnable via uvx (or on PATH)",
  "live_ollama: requires reachable Ollama at OLLAMA_BASE_URL with the configured model",
]
addopts = "-m 'not live_homelab and not live_ollama'"
# Phase 25 D-03: force our own pytest runs to ALWAYS surface project-emitted
# DeprecationWarnings (whose `module` starts with `mcp_test_framework`) so
# accidental use of the v1.4 deprecation shims is caught in the framework's
# own test suite. External operators' pytest configs are unaffected.
filterwarnings = [
    "always::DeprecationWarning:mcp_test_framework",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "TID"]

# Pitfall 4 (01-RESEARCH.md): TID251 does NOT catch submodule imports.
# Banning "homelab_mcp" here will catch `import homelab_mcp` and
# `from homelab_mcp import X`, but NOT `from homelab_mcp.client import X`
# or `from homelab_mcp.server.tools import Y`. Belt-and-suspenders:
# tests/conftest.py will ship a sys.modules guard (Plan 04) to catch the
# submodule-import gap at test-session start.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"homelab_mcp" = { msg = "Do not import homelab_mcp -- it is a black-box subprocess under test (see PROJECT.md). Drive it via mcp.client.stdio.stdio_client only." }

# Phase 17 D-04: pyright type-check scope.
# Scoped to generated SDET classes + the ToolResponse base only. The rest of
# src/ has v1.0-v1.2 type debt that's out of v1.3's scope (Pitfall 4 in
# 17-RESEARCH.md). When/if the whole codebase is brought under pyright,
# expand `include` and `strict`.
[tool.pyright]
# Phase 21.1 RELOC-04 + Phase 25 RENAME-04: `src/mcp_test_framework/test_code/generated`
# removed -- generated test-code classes now live at the operator-configured
# `test_code.generated_root` (typically outside `src/`). Type-checking generated
# output is the operator's responsibility (point their own pyright config
# at the configured path if they want strict coverage).
include = [
    "src/mcp_test_framework/test_code/response.py",
]
strict = [
    "src/mcp_test_framework/test_code/response.py",
]
reportMissingTypeStubs = false
pythonVersion = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling cannot auto-detect the package directory because the project name
# (mcp-contracts, post Phase 26 D-01) differs from the package name
# (mcp_test_framework, unchanged per D-04). Without this, `uv sync` fails
# with "Unable to determine which files to ship". Hatch maintainer-confirmed
# (hatch discussion #554, cited in 26-RESEARCH.md): `packages` auto-includes
# non-`.py` files including PEP 561 `py.typed` markers — Plan 26-03 relies
# on this to ship markers in the wheel without a `force-include` stanza.
[tool.hatch.build.targets.wheel]
packages = ["src/mcp_test_framework"]
