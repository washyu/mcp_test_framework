# config.example.yaml -- starter template with placeholder tool names.
#
# This file is HAND-CURATED to show the shape you fill in. Each tool entry
# below illustrates one pattern variation; a tool with no entry will be
# auto-skipped under the schema this release ships (see comments below).
#
# For a runnable scaffold against your actual server, run:
#   mcp-test-framework config-init -o config.yaml
#
# For a complete worked reference using the homelab-mcp server, see
# examples/homelab-mcp.yaml.

# Ollama judge backend.
ollama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen3.6:latest"
  timeout_seconds: 120

# MCP server under test. Replace with the launch command for your server.
mcp_server:
  command: "uvx"
  args: ["your-mcp-server-package"]
  timeout_seconds: 30

# Outer budget cap on each judge HTTP call.
judge_timeout_seconds: 120

# Schema version. This release accepts version 2.
version: 2

# SDET codegen + fixture output path. REQUIRED.
#
# The `mcp-test-framework gen-sdet-classes` command writes generated typed
# classes into <generated_root>/<server_slug>/, and the `mcp_session`
# pytest fixture loads them from the same path. Recommended convention:
# `tests/sdet/_generated` (colocated with your tests/sdet/ scenarios, the
# `_` prefix signals "tool-managed, don't hand-edit"). Pick any path you
# want -- the framework does not enforce a layout.
#
# Non-absolute paths are resolved relative to the current working
# directory when the config is loaded.
sdet:
  generated_root: "tests/sdet/_generated"

# Per-tool registry: each entry below illustrates one pattern variation.
# Replace placeholder names with actual tool names from
# `mcp-test-framework list-tools`.
#
# Pattern A -- minimal opt-in: name the tool and pick which rubrics judge it.
# Pattern B -- opt-in with pre-filled call arguments for tools that require
#              non-empty input to return a useful response.
# Pattern C -- opt-out with a curated reason: master-config + focus toggle.
#              Use this for tools that mutate real state and should not run
#              in your test surface.
tools:
  <safe_read_tool_a>:
    # Pattern A -- minimal opt-in. List the rubrics you want this tool
    # judged against. Empty `call_arguments` means the framework calls the
    # tool with `{}` (works for tools whose required-args list is empty).
    judges: [clarity, disambiguation, parameters]

  <safe_read_tool_b>:
    # Pattern B -- opt-in with pre-filled args. Required for tools that
    # error on empty input.
    call_arguments:
      query: "example"
      limit: 10

  <destructive_tool_c>:
    # Pattern C -- skip with a curated reason. The framework reports the
    # reason verbatim in the per-tool summary.
    skip: true
    skip_reason: "destructive: writes to production inventory"
